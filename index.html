<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX LIVE - Premium Streaming</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js for .ts streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        /* Glassmorphism & Effects */
        .glass-effect {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-hero-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Layout Utilities */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00ffcc, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #090d16;
            font-size: 20px;
            font-weight: bold;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo-text span { color: #00ffcc; }
        
        nav.nav-links {
            display: flex;
            gap: 32px;
        }
        nav.nav-links button {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }
        nav.nav-links button:hover { color: #00ffcc; }

        .live-badge-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        main {
            flex-grow: 1;
            padding: 40px 0;
        }

        /* Buttons & Grids */
        .btn-primary {
            background: linear-gradient(135deg, #00ffcc 0%, #10b981 100%);
            color: #090d16;
            font-weight: 700;
            padding: 16px 32px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.2);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .hero-banner {
            position: relative;
            border-radius: 24px;
            padding: 50px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 50px;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }
        .hero-tag {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(0, 255, 204, 0.2);
            display: inline-block;
            margin-bottom: 20px;
        }
        .hero-banner h1 {
            font-size: 48px;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .hero-banner p {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .section-title-row h2 {
            font-size: 26px;
            font-weight: 700;
        }
        .view-all-btn {
            color: #00ffcc;
            background: none;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .view-all-btn:hover { text-decoration: underline; }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .category-card {
            position: relative;
            height: 240px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.3s, transform 0.3s;
        }
        .category-card:hover {
            border-color: rgba(0, 255, 204, 0.5);
            transform: translateY(-4px);
        }
        .category-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            transition: transform 0.5s;
        }
        .category-card:hover img { transform: scale(1.08); }
        .category-card .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #090d16 10%, rgba(9, 13, 22, 0.4) 100%);
        }
        .category-card .content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .cat-icon-box {
            width: 44px;
            height: 44px;
            background: rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            font-size: 18px;
            margin-bottom: 12px;
        }
        .cat-arrow {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }
        .category-card:hover .cat-arrow {
            background: #00ffcc;
            color: #090d16;
        }

        /* Match Cards */
        .match-card {
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: border-color 0.3s, transform 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .match-card:hover {
            border-color: rgba(0, 255, 204, 0.4);
            transform: translateY(-3px);
        }
        .match-status {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-live {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-upcoming {
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }
        .match-title {
            font-size: 18px;
            font-weight: 700;
            margin: 16px 0 10px 0;
            transition: color 0.3s;
        }
        .match-card:hover .match-title { color: #00ffcc; }
        .match-meta {
            color: #94a3b8;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .watch-link {
            color: #00ffcc;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s;
        }
        .match-card:hover .watch-link { transform: translateX(4px); }

        /* Watch Room Layout */
        .watch-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        @media(max-width: 968px) {
            .watch-grid { grid-template-columns: 1fr; }
            .hero-banner h1 { font-size: 36px; }
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .chat-box-wrapper {
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }
        .chat-header {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }
        .chat-bubble {
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-bubble .username {
            font-size: 12px;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 2px;
            display: block;
        }
        .chat-form {
            padding: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            background: #05070c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input:focus { border-color: #00ffcc; }
        .chat-send-btn {
            background: #00ffcc;
            color: #090d16;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .chat-send-btn:hover { opacity: 0.9; }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 0;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="glass-effect">
        <div class="container navbar">
            <div class="logo-box" onclick="router.navigate('home')">
                <div class="logo-icon neon-glow">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="logo-text">VORTEX<span>LIVE</span></div>
            </div>
            <nav class="nav-links">
                <button onclick="router.navigate('home')">Home</button>
                <button onclick="router.navigate('categories')">Categories</button>
                <button onclick="router.navigate('about')">About Us</button>
            </nav>
            <div class="live-badge-wrapper">
                <span class="live-dot"></span>
                <span style="font-size: 12px; font-weight: 700; color: #34d399; letter-spacing: 0.5px;">SYSTEM LIVE</span>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="container" id="app">
        <!-- Dynamic content goes here -->
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container flex-between" style="flex-wrap: wrap; gap: 20px;">
            <p>&copy; 2026 VORTEX LIVE. All rights reserved.</p>
            <div style="display: flex; gap: 20px; font-size: 18px;">
                <a href="#" style="color: #94a3b8;"><i class="fa-brands fa-telegram"></i></a>
                <a href="#" style="color: #94a3b8;"><i class="fa-brands fa-discord"></i></a>
                <a href="#" style="color: #94a3b8;"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script src="script.js"></script>
</body>
</html>
