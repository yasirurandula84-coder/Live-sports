<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Live Match - StreamX</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js Library for .m3u8 Playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .custom-video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 450px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .custom-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .player-thumb-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            z-index: 5;
            transition: opacity 0.4s ease;
        }
        .player-thumb-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Username Modal -->
    <div class="modal-overlay" id="usernameModal">
        <div class="modal-content">
            <h2>Enter Chat Username</h2>
            <p>Choose a unique name to chat and join the community stream.</p>
            <input type="text" id="usernameInput" placeholder="Your Username..." autocomplete="off">
            <button id="joinChatBtn">Enter Live Room</button>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="logo">STREAMX</a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 id="matchTitle" class="section-title" style="margin-bottom: 15px;">Loading Match...</h2>
        
        <div class="watch-container">
            <div>
                <!-- Custom Modern Video Player Wrapper -->
                <div class="custom-video-container" id="playerContainer">
                    <!-- මැච් එකේ thumbnail එක ප්ලේයර් එක උඩින් පෙන්වීම සඳහා -->
                    <img id="playerThumbnail" class="player-thumb-overlay" src="" alt="Match Thumbnail">
                    
                    <video id="hlsPlayer" playsinline autoplay muted></video>
                    
                    <!-- Custom Controls Overlay with ID -->
                    <div class="video-controls-overlay" id="controlsOverlay" style="z-index: 10;">
                        <!-- Progress / Timeline Bar -->
                        <div class="progress-bar-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>

                        <div class="controls-row">
                            <div class="left-controls">
                                <button class="control-btn" id="playPauseBtn"><i class="fa-solid fa-pause"></i></button>
                                <button class="control-btn" id="skipBackwardBtn"><i class="fa-solid fa-rotate-left"></i> 10s</button>
                                <button class="control-btn" id="skipForwardBtn"><i class="fa-solid fa-rotate-right"></i> 10s</button>
                                
                                <div class="volume-box">
                                    <button class="control-btn" id="muteBtn"><i class="fa-solid fa-volume-xmark"></i></button>
                                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0">
                                </div>
                            </div>

                            <div class="right-controls">
                                <button class="control-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Server Switch Buttons -->
                <div class="server-selector" style="margin: 15px 0; display: flex; gap: 10px;">
                    <button id="btnServer1" onclick="switchServer('server1')" style="background: #e50914; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Server 1 (HD)</button>
                    <button id="btnServer2" onclick="switchServer('server2')" style="background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Server 2 (Backup)</button>
                </div>

                <div class="match-info-bar">
                    <span id="nowPlayingText" style="font-weight: 600; color: var(--accent-color);">● Data Saver Live Stream</span>
                    <div class="viewers-count">
                        <span>👀</span> <span id="viewersCount">0</span> Watching Now
                    </div>
                </div>
            </div>

            <!-- Live Chat Box -->
            <div class="chat-box">
                <div class="chat-header">Live Fan Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages appear here -->
                </div>
                <form class="chat-input-area" id="chatForm">
                    <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" required>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>

    <    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Right-click සහ F12 Block කිරීම (Security)
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
                (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || 'default-match';
        const matchTitle = urlParams.get('title') || 'Live Match';

        document.getElementById('matchTitle').innerText = matchTitle;

        const video = document.getElementById('hlsPlayer');
        const playerThumbnail = document.getElementById('playerThumbnail');
        const socket = io();
        let currentHls = null;
        let isMatchLive = false; // මැච් එක ලයිව් වී ඇද්දැයි පරීක්ෂා කිරීමට විචල්‍යයක්

        // සර්වර් එකෙන් මැච් අප්ඩේට් එකක් ලැබුණු වහාම පිටුව රිෆ්‍රෙෂ් නොකර දත්ත නැවත ලබා ගැනීම
        socket.on('refreshMatchesData', () => {
            console.log('Matches updated from server, fetching latest...');
            socket.emit('requestAllMatches');
        });
        
        // Server එකෙන් මැච් විස්තර ලබා ගැනීම
        socket.emit('requestAllMatches');

        socket.on('allMatchesData', (matchesData) => {
            let foundMatch = null;
            for (let cat in matchesData) {
                const match = matchesData[cat].find(m => m.id === matchId);
                if (match) {
                    foundMatch = match;
                    break;
                }
            }

            if (foundMatch) {
                if (foundMatch.thumbnail) {
                    playerThumbnail.src = foundMatch.thumbnail;
                }

                // මැච් එක UPCOMING නම් සහ වෙලාව ඉතිරිව ඇත්නම්
                if (foundMatch.status && foundMatch.status.toUpperCase() === 'UPCOMING' && foundMatch.time) {
                    isMatchLive = false; // තවම ලයිව් නැත
                    
                    // සර්වර් බටන්ස් සහ ප්ලේයර් එක පාලනය කිරීමට Server select කොටස අක්‍රීය කර තැබිය හැක
                    document.getElementById('btnServer1').style.opacity = '0.5';
                    document.getElementById('btnServer2').style.opacity = '0.5';

                    let timerDiv = document.getElementById('matchCountdownTimer');
                    if (!timerDiv) {
                        timerDiv = document.createElement('div');
                        timerDiv.id = 'matchCountdownTimer';
                        timerDiv.style.cssText = "background: rgba(22, 22, 22, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(0,0,0,0.4);";
                        
                        const targetArea = document.getElementById('playerContainer');
                        targetArea.parentNode.insertBefore(timerDiv, targetArea);
                    }
                    startCountdown(foundMatch.time, timerDiv);
                } else {
                    // මැච් එක LIVE වී නම් හෝ Time එක පසු වී නම් ස්ට්‍රීම් එක ලෝඩ් කිරීමට ඉඩ දීම
                    isMatchLive = true;
                    loadStream('server1');
                }
            }
        });

        function startCountdown(timeString, displayElement) {
            const today = new Date();
            let [time, modifier] = timeString.split(' ');
            let [hours, minutes] = time.split(':');
            
            if (modifier && modifier.toUpperCase() === 'PM' && hours !== '12') {
                hours = parseInt(hours, 10) + 12;
            }
            if (modifier && modifier.toUpperCase() === 'AM' && hours === '12') {
                hours = 0;
            }

            today.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0, 0);
            let targetTime = today.getTime();

            const interval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance < 0) {
                    clearInterval(interval);
                    displayElement.innerHTML = `<span style="color: #ff4757; font-weight: bold; font-size: 15px;"><i class="fa-solid fa-circle-dot fa-beat"></i> Match is starting soon / LIVE!</span>`;
                    
                    // ටයිම් එක අවසන් වූ පසු ස්වයංක්‍රීයව ලයිව් ස්ට්‍රීම් එක ප්ලේ වීම ඇරඹීම
                    isMatchLive = true;
                    document.getElementById('btnServer1').style.opacity = '1';
                    document.getElementById('btnServer2').style.opacity = '1';
                    loadStream('server1');
                    return;
                }

                const hoursLeft = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutesLeft = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const secondsLeft = Math.floor((distance % (1000 * 60)) / 1000);

                displayElement.innerHTML = `
                    <div style="color: var(--text-muted, #aaa); font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <i class="fa-regular fa-clock" style="color: var(--accent-color, #ff4757);"></i> 
                        <span>Match Starts In: <strong style="color: #fff;">${timeString}</strong></span>
                    </div>
                    <div style="display: flex; justify-content: center; gap: 12px; font-weight: 700; color: #fff; font-size: 18px;">
                        <span style="background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">${hoursLeft}h</span> : 
                        <span style="background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">${minutesLeft}m</span> : 
                        <span style="background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">${secondsLeft}s</span>
                    </div>
                `;
            }, 1000);
        }

        function loadStream(serverType) {
            // මැච් එක තවමත් ලයිව් කර නැත්නම් (Upcoming නම්) ලින්ක් ඉල්ලීම වැළැක්වීම
            if (!isMatchLive) {
                console.log("Match is still upcoming. Stream is locked.");
                return;
            }

            if(serverType === 'server1') {
                document.getElementById('btnServer1').style.background = '#e50914';
                document.getElementById('btnServer2').style.background = '#333';
            } else {
                document.getElementById('btnServer2').style.background = '#e50914';
                document.getElementById('btnServer1').style.background = '#333';
            }

            socket.emit('requestStreamLink', { matchId, serverType });
        }

        socket.on('secureStreamLink', (directLink) => {
            if (!isMatchLive) return; // ආරක්ෂාව සඳහා නැවත පරීක්ෂා කිරීම

            if (!directLink) {
                alert('Stream link not found, offline, or unauthorized for this server!');
                return;
            }

            if (currentHls) {
                currentHls.destroy();
            }

            if (Hls.isSupported()) {
                const hlsConfig = {
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    liveSyncDurationCount: 3,
                    highBufferWatchdogPeriod: 1,
                };

                const hls = new Hls(hlsConfig);
                currentHls = hls;
                hls.loadSource(directLink);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => {
                        console.log("Auto-play prevented by browser, waiting for user interaction:", e);
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = directLink;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(e => {
                        console.log("Auto-play prevented by browser, waiting for user interaction:", e);
                    });
                });
            }
        });

        // වීඩියෝ එක ඇත්තටම ප්ලේ වෙන්න පටන්ගත් පසු Thumbnail එක ඉවත් කිරීම
        video.addEventListener('playing', () => {
            playerThumbnail.classList.add('hidden');
            setTimeout(() => { 
                playerThumbnail.style.display = 'none'; 
            }, 400);
        });

        function switchServer(serverType) {
            if (!isMatchLive) {
                alert('Match has not started yet!');
                return;
            }
            playerThumbnail.style.display = 'block';
            playerThumbnail.classList.remove('hidden'); 
            loadStream(serverType);
        }

        // අනෙකුත් Player Controls සහ Chat Logic මෙහි යටින් දිගටම පවතී...

    
                                        

        // Custom Player Controls Logic
        const playPauseBtn = document.getElementById('playPauseBtn');
        const skipBackBtn = document.getElementById('skipBackwardBtn');
        const skipFwdBtn = document.getElementById('skipForwardBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const playerContainer = document.getElementById('playerContainer');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const controlsOverlay = document.getElementById('controlsOverlay');

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                video.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        });

        skipBackBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - 10);
        });

        skipFwdBtn.addEventListener('click', () => {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = false;
            if (video.volume == 0) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });

        muteBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                volumeSlider.value = video.volume;
            } else {
                video.muted = true;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                volumeSlider.value = 0;
            }
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        video.addEventListener('timeupdate', () => {
            if (video.duration > 0) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percent}%`;
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if(video.duration) {
                video.currentTime = video.duration * pos;
            }
        });

        let hideTimeout;
        function showControls() {
            controlsOverlay.classList.remove('hidden');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused) {
                    controlsOverlay.classList.add('hidden');
                }
            }, 3000);
        }

        playerContainer.addEventListener('mousemove', showControls);
        playerContainer.addEventListener('touchstart', showControls);
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                video.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                showControls();
            }
        });

        // Username & Chat Authentication Logic
        let username = localStorage.getItem('chat_username');
        const modal = document.getElementById('usernameModal');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinChatBtn');

        if (username) {
            modal.style.display = 'none';
            initSocket(username);
        }

        joinBtn.addEventListener('click', () => {
            const val = usernameInput.value.trim();
            if (val.length < 2) {
                alert('Please enter a valid username (at least 2 characters)');
                return;
            }
            username = val;
            localStorage.setItem('chat_username', username);
            modal.style.display = 'none';
            initSocket(username);
        });

        function initSocket(user) {
            const chatSocket = io();

            chatSocket.emit('joinMatch', { matchId, username: user });

            chatSocket.on('viewerCount', (count) => {
                document.getElementById('viewersCount').innerText = count;
            });

            const chatForm = document.getElementById('chatForm');
            const msgInput = document.getElementById('msgInput');
            const chatMessages = document.getElementById('chatMessages');

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const msg = msgInput.value.trim();
                if(msg) {
                    chatSocket.emit('chatMessage', msg);
                    msgInput.value = '';
                }
            });
            chatSocket.on('chatMessage', (data) => {
                // පරිශීලකයාගේ උපාංගයේ (Device එකේ) නිවැරදි වෙලාව ලබා ගැනීම
                const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                chatMessages.innerHTML += `
                    <div class="message">
                        <div class="msg-user">${data.username} <span style="font-weight:normal; font-size:11px; color:var(--text-muted); float:right;">${currentTime}</span></div>
                        <div>${data.message}</div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            
        }
    </script>
</body>
</html>
