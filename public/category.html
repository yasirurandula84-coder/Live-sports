<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - StreamX</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color, #ec4899);
        }

        /* Enhanced Card Styles with Smooth Hover & Shadows */
        .match-card {
            background: var(--card-bg, #161616);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            position: relative;
            backdrop-filter: blur(10px);
        }
        .match-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: var(--accent-color, #ec4899);
        }

        .match-thumb-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            overflow: hidden;
        }
        .match-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .match-card:hover .match-thumb-container img {
            transform: scale(1.05); /* Hover එකේදී Thumbnail එක පොඩ්ඩක් Zoom වීම */
        }

        .match-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Upcoming Badge Styling */
        .upcoming-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid var(--border-color, rgba(255,255,255,0.15));
            z-index: 2;
        }

        /* Skeleton Loading Animation Styles */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">STREAMX</a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title" id="categoryTitle" style="letter-spacing: 0.5px; font-weight: 700; margin-bottom: 25px;">Live & Upcoming Matches</h2>
        
        <div class="matches-grid" id="matchesGrid">
            <!-- Loading Skeletons දර්ශනය වීම සඳහා මුලින් පෙන්වන කොටස -->
            <div class="match-card skeleton" style="height: 320px;"></div>
            <div class="match-card skeleton" style="height: 320px;"></div>
            <div class="match-card skeleton" style="height: 320px;"></div>
        </div>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat') || 'cricket';
        
        document.getElementById('categoryTitle').innerText = `${cat.toUpperCase()} Matches`;
        const grid = document.getElementById('matchesGrid');

        // Server එකෙන් මැච් ලැයිස්තුව ඉල්ලීම
        socket.emit('requestAllMatches');

        // Server එකෙන් ඩේටා ආපු ගමන් screen එකට load කිරීම
        socket.on('allMatchesData', (matchesData) => {
            const list = matchesData[cat] || [];

            if(list.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No matches available right now.</p>`;
            } else {
                grid.innerHTML = ''; // Clear skeleton items
                list.forEach(match => {
                    let statusBadge = '';
                    
                    // සෙවීමේ පහසුව සඳහා status එක uppercase කර පරීක්ෂා කිරීම
                    if (match.status && match.status.toUpperCase() === 'LIVE') {
                        statusBadge = `<div class="live-badge"><span class="live-dot"></span> LIVE NOW</div>`;
                    } else {
                        statusBadge = `<div class="upcoming-badge">UPCOMING</div>`;
                    }

                    let matchTime = match.time ? `
                        <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; margin-top: 4px;">
                            <i class="fa-regular fa-clock" style="color: var(--accent-color, #ec4899);"></i>
                            <span>Starts at: <strong style="color: #fff;">${match.time}</strong></span>
                        </div>
                    ` : '';

                    grid.innerHTML += `
                        <div class="match-card" onclick="location.href='match.html?id=${match.id}&title=${encodeURIComponent(match.title)}'">
                            <div class="match-thumb-container">
                                <img src="${match.thumbnail || 'https://via.placeholder.com/600x337?text=StreamX'}" alt="Match Thumbnail">
                                ${statusBadge}
                            </div>
                            <div class="match-details">
                                <div class="match-teams" style="font-weight:700; font-size:16px; color:#fff; display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px 0;">
                                    <span>${match.team1}</span>
                                    <span class="vs" style="color:var(--text-muted); font-size: 13px; font-weight: 500;">VS</span>
                                    <span>${match.team2}</span>
                                </div>
                                <p style="color: var(--text-muted); font-size: 13px; margin: 0; line-height: 1.4;">${match.title}</p>
                                ${matchTime}
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
