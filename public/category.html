<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b0b0e; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #141419; border: 1px solid rgba(255,255,255,0.08); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #6366f1; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #9ca3af; }
        input, select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: #6366f1; }
        button { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(1.1); }
        .match-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3b82f6; padding: 8px 12px; font-size: 12px; }
        .delete-btn { background: #ef4444; padding: 8px 12px; font-size: 12px; }
        .cancel-btn { background: #6b7280; padding: 12px 20px; display: none; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fa-solid fa-gauge-high"></i> StreamX Admin Panel</h2>
        
        <!-- Add / Edit Match Form -->
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px;">
            <h3 id="formTitle" style="margin-top:0; font-size: 16px;">Add New Match</h3>
            <input type="hidden" id="editCategory" value="">
            <input type="hidden" id="editIndex" value="">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Category (e.g. cricket)</label>
                    <input type="text" id="category" value="cricket">
                </div>
                <div class="form-group">
                    <label>Match ID (e.g. match-05)</label>
                    <input type="text" id="matchId" placeholder="match-05">
                </div>
            </div>
            <div class="form-group">
                <label>Match Title</label>
                <input type="text" id="title" placeholder="LIVE - BAN VS WI LIVE TEST CRICKET MATCH">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Team 1</label>
                    <input type="text" id="team1" placeholder="BANGLADESH">
                </div>
                <div class="form-group">
                    <label>Team 2</label>
                    <input type="text" id="team2" placeholder="WEST INDIES">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="LIVE">LIVE</option>
                        <option value="UPCOMING">UPCOMING</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Match Date</label>
                    <input type="date" id="matchDate">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="text" id="time" placeholder="09:00 AM">
                </div>
                <div class="form-group">
                    <label>Thumbnail URL</label>
                    <input type="text" id="thumbnail" placeholder="https://...">
                </div>
            </div>
            <div class="form-group">
                <label>Stream Link 1 (m3u8, mpd+drm, or youtube)</label>
                <input type="text" id="link1" placeholder="https://...">
            </div>
            <div style="display: flex;">
                <button id="saveBtn" onclick="saveMatch()"><i class="fa-solid fa-plus"></i> Add Match to GitHub</button>
                <button id="cancelBtn" class="cancel-btn" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Cancel</button>
            </div>
        </div>

        <h3>Existing Matches in Private Repo</h3>
        <div id="matchesList">Loading matches...</div>
    </div>

    <script>
        let allMatchesData = {};

        async function fetchMatches() {
            try {
                const res = await fetch('/api/admin/matches');
                const data = await res.json();
                allMatchesData = data.content || {};
                renderMatches();
            } catch (err) {
                document.getElementById('matchesList').innerHTML = 'Error loading matches.';
            }
        }

        function renderMatches() {
            const listDiv = document.getElementById('matchesList');
            listDiv.innerHTML = '';
            
            if (Object.keys(allMatchesData).length === 0) {
                listDiv.innerHTML = '<p style="color: #9ca3af;">No matches found.</p>';
                return;
            }

            for (let cat in allMatchesData) {
                allMatchesData[cat].forEach((match, index) => {
                    listDiv.innerHTML += `
                        <div class="match-card">
                            <div>
                                <strong style="color: #6366f1;">[${cat.toUpperCase()}]</strong> ${match.title} 
                                <br><small style="color: #9ca3af;">Status: ${match.status} | Date: ${match.date || 'N/A'} | Time: ${match.time}</small>
                            </div>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="editMatch('${cat}', ${index})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                <button class="delete-btn" onclick="deleteMatch('${cat}', ${index})"><i class="fa-solid fa-trash"></i> Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function editMatch(cat, index) {
            const match = allMatchesData[cat][index];
            
            document.getElementById('category').value = cat;
            document.getElementById('matchId').value = match.id || '';
            document.getElementById('title').value = match.title || '';
            document.getElementById('team1').value = match.team1 || '';
            document.getElementById('team2').value = match.team2 || '';
            document.getElementById('status').value = match.status || 'LIVE';
            document.getElementById('matchDate').value = match.date || '';
            document.getElementById('time').value = match.time || '';
            document.getElementById('thumbnail').value = match.thumbnail || '';
            document.getElementById('link1').value = match.link1 || '';

            document.getElementById('editCategory').value = cat;
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').innerText = 'Edit Match';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update Match on GitHub';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('category').value = 'cricket';
            document.getElementById('matchId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('team1').value = '';
            document.getElementById('team2').value = '';
            document.getElementById('status').value = 'LIVE';
            document.getElementById('matchDate').value = '';
            document.getElementById('time').value = '';
            document.getElementById('thumbnail').value = '';
            document.getElementById('link1').value = '';

            document.getElementById('editCategory').value = '';
            document.getElementById('editIndex').value = '';

            document.getElementById('formTitle').innerText = 'Add New Match';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Add Match to GitHub';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        async function saveMatch() {
            const cat = document.getElementById('category').value.trim();
            const editCat = document.getElementById('editCategory').value;
            const editIdx = document.getElementById('editIndex').value;

            // නිවැරදි කරන ලද Thumbnail සහ Date ලබා ගැනීම
            const matchData = {
                id: document.getElementById('matchId').value.trim(),
                title: document.getElementById('title').value.trim(),
                team1: document.getElementById('team1').value.trim(),
                team2: document.getElementById('team2').value.trim(),
                status: document.getElementById('status').value,
                date: document.getElementById('matchDate').value.trim(),
                time: document.getElementById('time').value.trim(),
                thumbnail: document.getElementById('thumbnail').value.trim(),
                link1: document.getElementById('link1').value.trim(),
                link2: ""
            };

            if (!matchData.id || !matchData.title) {
                alert('Please fill Match ID and Title!');
                return;
            }

            if (editCat !== '' && editIdx !== '') {
                if (editCat === cat) {
                    allMatchesData[cat][editIdx] = matchData;
                } else {
                    allMatchesData[editCat].splice(editIdx, 1);
                    if (allMatchesData[editCat].length === 0) delete allMatchesData[editCat];
                    
                    if (!allMatchesData[cat]) allMatchesData[cat] = [];
                    allMatchesData[cat].push(matchData);
                }
            } else {
                if (!allMatchesData[cat]) {
                    allMatchesData[cat] = [];
                }
                allMatchesData[cat].push(matchData);
            }

            await saveToGitHub();
            resetForm();
        }

        async function deleteMatch(cat, index) {
            if (confirm('Are you sure you want to delete this match?')) {
                allMatchesData[cat].splice(index, 1);
                if (allMatchesData[cat].length === 0) {
                    delete allMatchesData[cat];
                }
                await saveToGitHub();
            }
        }

        async function saveToGitHub() {
            const res = await fetch('/api/admin/save-matches', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updatedData: allMatchesData })
            });
            const result = await res.json();
            if (result.success) {
                alert('Successfully updated matches.json on Private Repo!');
                fetchMatches();
            } else {
                alert('Error: ' + result.error);
            }
        }

        fetchMatches();
    </script>
</body>
</html>
