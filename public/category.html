<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - StreamX</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Thumbnail එක සහ Card එක ලස්සනට Set කරගන්න CSS Styles */
        .match-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #333;
        }
        .match-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }
        .match-thumb-container {
            position: relative;
            width: 100%;
            height: 200px; /* Thumbnail එකේ උස */
            background: #000; /* ෆොටෝ එකෙන් ඉතිරි වන පැති කළු පැහැයෙන් පෙන්වීමට */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .match-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ෆොටෝ එක කැපී යාම වළක්වා මුළු රූපයම පෙන්වයි */
        }
        .match-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* LIVE NOW Badge Styles */
        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
            z-index: 10;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* UPCOMING Badge Styles */
        .upcoming-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">STREAMX</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title" id="categoryTitle">Live & Upcoming Matches</h2>
        
        <div class="matches-grid" id="matchesGrid">
            <!-- Dynamic Match Cards will load here -->
        </div>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat') || 'cricket';
        
        document.getElementById('categoryTitle').innerText = `${cat.toUpperCase()} Matches`;
        const grid = document.getElementById('matchesGrid');

        // Server එකෙන් මැච් ලැයිස්තුව ඉල්ලීම
        socket.emit('requestAllMatches');

                // සර්වර් එකෙන් මැච් ලැයිස්තුව වෙනස් වූ විට (Upcoming සිට Live මාරු වූ විට) ස්වයංක්‍රීයව අලුත් කිරීම
        socket.on('refreshMatchesData', () => {
            console.log('Category matches updated from server, fetching latest...');
            socket.emit('requestAllMatches');
        });
        

        // Server එකෙන් ඩේටා ආපු ගමන් screen එකට load කිරීම
        socket.on('allMatchesData', (matchesData) => {
            const list = matchesData[cat] || [];

            if(list.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted)">No matches available right now.</p>`;
            } else {
                grid.innerHTML = ''; 
                                list.forEach(match => {
                    let statusBadge = '';
                    let isActuallyLive = false; // තාවකාලික විචල්‍යයක්

                    // 1. කාලය පරීක්ෂා කිරීම (startsAt යනු JavaScript Date object එකක් විය යුතුය)
                    if (match.time) {
                        const now = new Date();
                        // මැච් එකේ time එක (උදා: "07:30 PM") අද දිනට අදාළව Date object එකකට හරවා ගැනීම
                        const startsAt = parseTimeStringToDate(match.time); 

                        // කාලය දැනටමත් පසු වී ඇත්නම් හෝ සමාන නම් LIVE ලෙස සැලකේ
                        if (startsAt && now >= startsAt) {
                            isActuallyLive = true;
                        }
                    }

                    // 2. JSON එකේ ස්ටේටස් එක හෝ ගණනය කළ ස්ටේටස් එක පරීක්ෂා කිරීම
                    if ((match.status && match.status.trim().toUpperCase() === 'LIVE') || isActuallyLive) {
                        statusBadge = `<div class="live-badge"><span class="live-dot"></span> LIVE NOW</div>`;
                    } else {
                        statusBadge = `<div class="upcoming-badge">UPCOMING</div>`;
                    }
                    
    


                    // අනිත් ටීම් ඩේටා වගේම 'match.time' එක කෙලින්ම ගෙනැවිත් මෙතැනට ඇතුළත් කිරීම
                    let matchTime = match.time ? `
                        <div style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13px; margin-top: 2px;">
                            <i class="fa-regular fa-clock" style="color: var(--accent-color);"></i>
                            <span>Starts at: <strong style="color: #fff;">${match.time}</strong></span>
                        </div>
                    ` : '';

                    grid.innerHTML += `
                        <div class="match-card" onclick="location.href='match.html?id=${match.id}&title=${encodeURIComponent(match.title)}'">
                            <div class="match-thumb-container">
                                <img src="${match.thumbnail || 'https://via.placeholder.com/600x337?text=StreamX'}" alt="Match Thumbnail">
                                ${statusBadge}
                            </div>
                            <div class="match-details">
                                <div class="match-teams" style="font-weight:bold; font-size:16px; color:#fff;">
                                    <span>${match.team1}</span>
                                    <span class="vs" style="color:#888; margin:0 5px;">VS</span>
                                    <span>${match.team2}</span>
                                </div>
                                <p style="color: var(--text-muted); font-size: 13px; margin: 0;">${match.title}</p>
                                ${matchTime}
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
