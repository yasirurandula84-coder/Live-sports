<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - StreamX</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Thumbnail එක සහ Card එක ලස්සනට Set කරගන්න CSS Styles */
        .match-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #333;
        }
        .match-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }
        .match-thumb-container {
            position: relative;
            width: 100%;
            height: 160px; /* Thumbnail එකේ උස */
            background: #000;
        }
        .match-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .match-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">STREAMX</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title" id="categoryTitle">Live & Upcoming Matches</h2>
        
        <div class="matches-grid" id="matchesGrid">
            <!-- Dynamic Match Cards will load here -->
        </div>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat') || 'cricket';
        
        document.getElementById('categoryTitle').innerText = `${cat.toUpperCase()} Matches`;
        const grid = document.getElementById('matchesGrid');

        // Server එකෙන් මැච් ලැයිස්තුව ඉල්ලීම
        socket.emit('requestAllMatches');

        // Server එකෙන් ඩේටා ආපු ගමන් screen එකට load කිරීම
        socket.on('allMatchesData', (matchesData) => {
            console.log("Received Matches Data:", matchesData); // F12 -> Console එකේ ඩේටා බලන්න
            const list = matchesData[cat] || [];

            if(list.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted)">No matches available right now.</p>`;
            } else {
                grid.innerHTML = ''; // Clear loading/old items
                list.forEach(match => {
                    let statusBadge = '';
                    
                    // මැච් එක LIVE දැයි පරීක්ෂා කිරීම
                    if (match.status && match.status.toUpperCase() === 'LIVE') {
                        statusBadge = `<div class="live-badge"><span class="live-dot"></span> LIVE NOW</div>`;
                    } else {
                        // time එක ලබා ගැනීම (match.time හෝ වෙනත් නමක් වුවත් වැඩ කිරීමට)
                        let matchTime = match.time || match.timing || '';
                        let timeHtml = matchTime ? `<span style="background:rgba(0,0,0,0.8); color:#fff; padding:3px 8px; font-size:11px; font-weight:600; border-radius:4px; border:1px solid rgba(255,255,255,0.2);"><i class="fa-regular fa-clock" style="color:var(--accent-color);"></i> ${matchTime}</span>` : '';
                        
                        statusBadge = `
                            <div style="position:absolute; top:10px; right:10px; display:flex; gap:6px; align-items:center;">
                                ${timeHtml}
                                <span style="background:rgba(0,0,0,0.8); color:#fff; padding:3px 8px; font-size:11px; font-weight:700; border-radius:4px;">UPCOMING</span>
                            </div>
                        `;
                    }

                    grid.innerHTML += `
                        <div class="match-card" onclick="location.href='match.html?id=${match.id}&title=${encodeURIComponent(match.title)}'">
                            <!-- උඩින් Thumbnail එක සහ Status/Time Badge එක -->
                            <div class="match-thumb-container">
                                <img src="${match.thumbnail || 'https://via.placeholder.com/600x337?text=StreamX'}" alt="Match Thumbnail">
                                ${statusBadge}
                            </div>
                            <!-- යටින් මැච් එකේ Details ටික -->
                            <div class="match-details">
                                <div class="match-teams" style="font-weight:bold; font-size:16px; color:#fff;">
                                    <span>${match.team1}</span>
                                    <span class="vs" style="color:#888; margin:0 5px;">VS</span>
                                    <span>${match.team2}</span>
                                </div>
                                <p style="color: var(--text-muted); font-size: 13px; margin: 0;">${match.title}</p>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
